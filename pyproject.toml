[project]
name = "kuairand-research-agent"
version = "0.1.0"
description = "Autonomous ML research agent for the KuaiRand-Pure ranking benchmark (TechJam 2026, Track 2)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "realdata: tests that need the real KuaiRand-Pure dataset (skipped if absent)",
    "slow: slow tests",
]
