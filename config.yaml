# ---------------------------------------------------------------------------
# Autonomous ML Research Agent — configuration (spec §9).
# Every constant, model name, path and threshold lives HERE, never in code.
# API keys are read from the environment variable named in llm.api_key_env.
# ---------------------------------------------------------------------------
llm:
  # DEFAULT PROVIDER: OpenRouter (one key, every model). Switch with --llm-profile <anthropic|gemini|groq|...>.
  provider: openrouter             # -> https://openrouter.ai/api/v1 (OpenAI-compatible Chat Completions)
  api_key_env: OPENROUTER_API_KEY  # key from https://openrouter.ai/keys — put it in .env, never in git
  # Model choice — PAID models on OpenRouter (the account is not free-tier, and the `:free` variants are heavily
  # contended: several returned 429 or "no endpoints available" when probed on 2026-08-28).
  #   minimax/minimax-m3   $0.30/$1.20 per MTok — 80.5% SWE-bench Verified, 1M context, 512k max output
  #   deepseek/deepseek-v4-flash $0.09/$0.18 — the Scribe's ≤20-word job does not need more
  #   z-ai/glm-5.2 $1.19/$3.74 — #1 open-weight on the Artificial Analysis index; fallback / quality upgrade
  # Cost: ~$0.013 per iteration, so a full 50-iteration run is well under $1.
  # Free models instead: --llm-profile openrouter_free   |   Claude: --llm-profile openrouter_claude
  researcher_model: minimax/minimax-m3
  engineer_model: minimax/minimax-m3
  debugger_model: minimax/minimax-m3
  scribe_model: deepseek/deepseek-v4-flash
  fallback_models:                 # tried in order when the primary is rate-limited (429) or unavailable
    researcher: [z-ai/glm-5.2, deepseek/deepseek-v4-flash]
    engineer:   [z-ai/glm-5.2, deepseek/deepseek-v4-flash]
    debugger:   [z-ai/glm-5.2, deepseek/deepseek-v4-flash]
    scribe:     [minimax/minimax-m3]
  max_output_tokens: {researcher: 4000, engineer: 16000, debugger: 16000, scribe: 400}
  extra_headers: {HTTP-Referer: "https://github.com/", X-Title: "kuairand-research-agent"}
  max_total_tokens: 4000000        # spend guard: stop the run (finalize from best/) past this many total tokens
  request_timeout_s: 600
  max_retries: 5                   # per model, then the next fallback model (free tiers are 20 rpm and flaky)
  scribe_narrative: true           # Scribe job (b): render logs/iter_NN.md from harness-supplied facts
  # --- the settings below are only read by the native Anthropic client (provider: anthropic) ---
  allow_sdk_default_credentials: false
  effort: {researcher: high, engineer: high, debugger: medium, scribe: null}
  thinking: {researcher: adaptive, engineer: adaptive, debugger: adaptive, scribe: none}
  refusal_fallbacks: true
  prompt_caching: true

  profiles:
    # --- FREE tiers (no card). Model handles change often: confirm with `--llm-list-models` before a real run. ---
    gemini:                        # BEST FREE FIT: 10 rpm / 250k tokens-per-minute / 1500 req-day, 1M context
      provider: gemini             # -> https://generativelanguage.googleapis.com/v1beta/openai/ (OpenAI-compatible)
      api_key_env: GEMINI_API_KEY  # key from https://aistudio.google.com/apikey
      researcher_model: gemini-3.7-flash
      engineer_model: gemini-3.7-flash
      debugger_model: gemini-3.7-flash
      scribe_model: gemini-3.7-flash
      max_output_tokens: {researcher: 3000, engineer: 12000, debugger: 12000, scribe: 300}
      max_retries: 5

    groq:                          # free, very fast, but only ~6k tokens-per-minute -> long waits on big briefings
      provider: groq               # -> https://api.groq.com/openai/v1   key: https://console.groq.com/keys
      api_key_env: GROQ_API_KEY
      researcher_model: openai/gpt-oss-120b
      engineer_model: openai/gpt-oss-120b
      debugger_model: openai/gpt-oss-120b
      scribe_model: llama-3.1-8b-instant
      max_output_tokens: {researcher: 3000, engineer: 12000, debugger: 12000, scribe: 300}
      max_retries: 6

    openrouter:                    # the default provider — this profile only exists to switch BACK to it
      provider: openrouter         # free: 20 rpm / 50 req-day (1000/day once the account has spent $10 once)
      api_key_env: OPENROUTER_API_KEY

    openrouter_free:               # $0 but flaky: free variants are contended (429) and some have no endpoint
      provider: openrouter
      api_key_env: OPENROUTER_API_KEY
      researcher_model: minimax/minimax-m3:free
      engineer_model: minimax/minimax-m3:free
      debugger_model: minimax/minimax-m3:free
      scribe_model: cohere/north-mini-code:free
      fallback_models: {researcher: [z-ai/glm-5.2:free, minimax/minimax-m3], engineer: [z-ai/glm-5.2:free, minimax/minimax-m3],
                        debugger: [z-ai/glm-5.2:free, minimax/minimax-m3], scribe: [minimax/minimax-m3:free, deepseek/deepseek-v4-flash]}

    openrouter_glm:                # higher-quality open weights (#1 on the Artificial Analysis index), ~4x the cost
      provider: openrouter
      api_key_env: OPENROUTER_API_KEY
      researcher_model: z-ai/glm-5.2
      engineer_model: z-ai/glm-5.2
      debugger_model: z-ai/glm-5.2
      scribe_model: deepseek/deepseek-v4-flash
      fallback_models: {researcher: [minimax/minimax-m3], engineer: [minimax/minimax-m3],
                        debugger: [minimax/minimax-m3], scribe: [minimax/minimax-m3]}

    openrouter_claude:             # same key, real Claude models (pay-as-you-go, ~$10-20 for a full run)
      provider: openrouter
      api_key_env: OPENROUTER_API_KEY
      researcher_model: anthropic/claude-opus-4.8
      engineer_model: anthropic/claude-opus-4.8
      debugger_model: anthropic/claude-opus-4.8
      scribe_model: anthropic/claude-haiku-4.5
      fallback_models: {}

    anthropic:                     # native Anthropic API (prompt caching + adaptive thinking + effort)
      provider: anthropic
      api_key_env: ANTHROPIC_API_KEY
      researcher_model: claude-opus-5
      engineer_model: claude-opus-5
      debugger_model: claude-opus-5
      scribe_model: claude-haiku-4-5
      fallback_models: {}

    cerebras:                      # 1M tokens/day free BUT 8k context on the free tier -> too small for the
      provider: cerebras           # Researcher/Engineer briefings; usable for the Scribe only.
      api_key_env: CEREBRAS_API_KEY
      researcher_model: gpt-oss-120b
      engineer_model: gpt-oss-120b
      debugger_model: gpt-oss-120b
      scribe_model: gpt-oss-120b
      max_output_tokens: {researcher: 2000, engineer: 8000, debugger: 8000, scribe: 300}

    deepseek:                      # cheap PAID (no free tier), strong at code -> https://api.deepseek.com
      provider: deepseek
      api_key_env: DEEPSEEK_API_KEY
      researcher_model: deepseek-chat
      engineer_model: deepseek-chat
      debugger_model: deepseek-chat
      scribe_model: deepseek-chat
      max_output_tokens: {researcher: 3000, engineer: 8000, debugger: 8000, scribe: 300}

    poe:                           # Poe's Anthropic-compatible gateway: one Poe key gives access to the Claude bots.
      provider: poe                # -> base_url https://api.poe.com, key sent as x-api-key, core Messages API only
      api_key_env: POE_API_KEY
      base_url: https://api.poe.com
      # Poe bot handles as listed by GET https://api.poe.com/v1/models on 2026-08-28: claude-opus-4.8 / 4.7 / 4.6 / 4.5,
      # claude-sonnet-4.6 / 4.5, claude-haiku-4.5 (no Opus 5 / Sonnet 5 exposed by the API yet). Verify with --llm-check.
      researcher_model: claude-opus-4.8
      engineer_model: claude-opus-4.8
      debugger_model: claude-opus-4.8
      scribe_model: claude-haiku-4.5
      refusal_fallbacks: false     # beta headers / fallbacks / thinking / effort / cache_control are not sent to gateways
      prompt_caching: false
      thinking: {researcher: none, engineer: none, debugger: none, scribe: none}
      effort: {researcher: null, engineer: null, debugger: null, scribe: null}
      max_output_tokens: {researcher: 3000, engineer: 12000, debugger: 12000, scribe: 300}

run:
  EPSILON: 0.002                   # streak resets only on improvement > EPSILON over best-so-far
  N_FLAT: 3                        # converged after N_FLAT consecutive flat/failed iterations
  MAX_ITERS: 50
  WALL_CLOCK_HOURS: 6
  PROMOTE_MARGIN: 0.0010           # promotion needs primary > best + PROMOTE_MARGIN (separate from EPSILON)
  DEBUG_RETRIES: 3                 # debugger attempts per iteration; retries never consume iterations
  EXPERIMENT_TIMEOUT_S: 900        # hard kill for one pipeline run (train + predict val)
  FINALIZE_TIMEOUT_S: 1800         # hard kill for the single champion --split test pass
  STALL_FAILURES: 3                # N consecutive failed iterations -> canned recovery directive in next briefing
  retry_timeouts_with_debugger: false   # a timeout is terminal for the iteration (no traceback to fix)
  mask_test_period_in_loop: true   # experiments see a derived data dir WITHOUT test-period rows
  categories: [feature, model, training, multitask, other]   # §5.1 category vocabulary

paths:
  starter_kit: ./starter_kit
  data: ./starter_kit/KuaiRand-Pure/data          # kit README: unpack KuaiRand-Pure inside the kit dir
  loop_data: ./data_cache/loop_train_valid        # derived train+valid-only copy used during the loop
  sealed: ./sealed
  runs: ./runs
  prompts: ./prompts
  knowledge: ./knowledge/library.md
  baseline_repro: ./baseline_repro                # iteration-0 champion source (pipeline.py)
  baseline_scores: ./starter_kit/baseline_scores.json   # published rungs; Phase 0 reads expectations from here

phase0:
  assert_rungs: true               # abort loudly if the rungs / baseline do not reproduce
  rung_tolerance: 0.01             # |random - published| and |pop - published| on VALID
  baseline_tolerance: 0.005        # |FM - published 0.6016| on VALID (5-seed std is 0.0008)
  random_seed: 0
  pop_prior: 20.0                  # same smoothing prior as starter_kit/baseline.py run_pop

sandbox:
  python: null                     # null -> the interpreter running the harness (project venv)
  isolation: auto                  # auto | sandbox-exec | none  (auto = sandbox-exec on macOS, else none+warning)
  env_passthrough: [PATH, HOME, LANG, LC_ALL, TMPDIR]   # everything else (incl. API keys) is stripped
  threads: null                    # e.g. 4 -> OMP/MKL/OPENBLAS thread caps for the pipeline process
  # Static guard on LLM-written code before it runs (defence in depth; the OS sandbox is the real wall).
  forbidden_imports: [subprocess, socket, urllib, requests, http, ftplib, smtplib, telnetlib, pip, ensurepip, ctypes]
  forbidden_patterns: ["pip install", "os.system(", "os.popen(", "os.execv", "shutil.rmtree(", "__import__("]

# Toy task (Phase-1 skeleton demo and tests): mini synthetic dataset in kit format + dummy pipeline.
toy:
  data_dir: ./data_cache/toy/data
  loop_data: ./data_cache/toy/loop
  champion_src: ./data_cache/toy/champion
  seed: 0
  overrides:
    run: {MAX_ITERS: 5, N_FLAT: 99, EXPERIMENT_TIMEOUT_S: 60, FINALIZE_TIMEOUT_S: 60}
    llm: {scribe_narrative: true}
