# ---------------------------------------------------------------------------
# Autonomous ML Research Agent — configuration (spec §9).
# Every constant, model name, path and threshold lives HERE, never in code.
# API keys are read from the environment variable named in llm.api_key_env.
# ---------------------------------------------------------------------------
llm:
  # DEFAULT PROVIDER: OpenRouter (one key, every model). Switch with --llm-profile <anthropic|gemini|groq|...>.
  provider: openrouter             # -> https://openrouter.ai/api/v1 (OpenAI-compatible Chat Completions)
  api_key_env: OPENROUTER_API_KEY  # key from https://openrouter.ai/keys — put it in .env, never in git
  # Model choice (2026-08-28): quality where it matters, cost where it does not.
  #   Researcher  z-ai/glm-5.2               best plans seen in this project (precise specs, cites the ledger and the
  #                                           playbook); reasons 15-30k chars per call, so ~1-2 min; ~$0.02 per call.
  #   Engineer    deepseek/deepseek-v4-flash  ~2.5 min per full-pipeline rewrite (it reasons first), the only model
  #   Debugger                                here that produced correct non-trivial code unaided (qwen3-coder: 2/6).
  #   Scribe      mistralai/codestral-2508    0.4 s, $0.0028.
  # ≈ $0.03 per iteration; ~6 min per iteration -> 50 iterations in ~5 h. Faster/cheaper coder: --llm-profile fast.
  researcher_model: z-ai/glm-5.2
  engineer_model: deepseek/deepseek-v4-flash
  debugger_model: deepseek/deepseek-v4-flash
  scribe_model: mistralai/codestral-2508
  fallback_models:                 # tried in order when the primary stalls, is rate-limited (429) or unavailable
    researcher: [deepseek/deepseek-v4-flash, qwen/qwen3-coder]
    engineer:   [qwen/qwen3-coder, mistralai/codestral-2508]
    debugger:   [qwen/qwen3-coder, mistralai/codestral-2508]
    scribe:     [qwen/qwen3-coder]
  reasoning:                       # OpenRouter unified parameter (`effort` works on every model here; Claude 5 rejects
    researcher: {effort: high}     # team decision 2026-08-29; NOTE run `ten` showed GLM ignoring a reasoning token cap, so this may be soft
    engineer: {effort: low}        # reasoning helps correctness; low keeps the call ~2-3 min
    debugger: {effort: low}
    scribe: {}
  # researcher 40000: GLM-5.2's hidden reasoning on a ~25k-char briefing exhausted 12000 (50k reasoning chars, zero
  # visible plan) in 9 of 11 calls; the cap covers reasoning + visible output. Worst case ~4 min / ~$0.15 per call.
  max_output_tokens: {researcher: 40000, engineer: 24000, debugger: 24000, scribe: 600}   # includes any thinking
  # Streaming timeouts (OpenAI-compatible providers): a stalled generation is abandoned after inactivity_timeout_s
  # without a token, every call is capped at call_timeout_s, one retry, then the next fallback model.
  inactivity_timeout_s: 120
  call_timeout_s: 900
  timeout_retries: 1
  heartbeat_s: 30                  # progress line while a long generation streams
  show_reasoning: []               # roles whose full reasoning stream is printed on the console after each call
                                   # (e.g. [researcher]); it is always saved in iterations/itNN/llm/<role>.md
  console_plan: brief              # brief = HYP line + predicted gain/evidence + rationale (citations) + ablation plan,
                                   # one line each; full = the whole plan incl. the change spec in a box; off = HYP only
  extra_headers: {HTTP-Referer: "https://github.com/", X-Title: "kuairand-research-agent"}
  # OpenRouter routes by PRICE by default; the same model then lands on whichever of ~17 backends is cheapest, and
  # one call ran at 7 tok/s vs 74 tok/s on the previous call (2026-08-29). Throughput sorting picks, per request,
  # the backend currently serving the most tokens/s; the price difference is a few cents per million tokens.
  extra_body: {provider: {sort: throughput, allow_fallbacks: true}}
  max_total_tokens: 4000000        # spend guard: stop the run (finalize from best/) past this many total tokens
  request_timeout_s: 600
  max_retries: 3                   # rate-limit / 5xx retries per model, then the next fallback model
  scribe_narrative: true           # Scribe job (b): render logs/iter_NN.md from harness-supplied facts
  scribe_digest: true              # Scribe job (c): ≤150-word research synthesis of the harness digest (every iteration so
                                   # far), rebuilt each iteration from the table, number-checked; shown to the Researcher
  # --- the settings below are only read by the native Anthropic client (provider: anthropic) ---
  allow_sdk_default_credentials: false
  effort: {researcher: high, engineer: high, debugger: medium, scribe: null}
  thinking: {researcher: adaptive, engineer: adaptive, debugger: adaptive, scribe: none}
  refusal_fallbacks: true
  prompt_caching: true

  profiles:
    # --- FREE tiers (no card). Model handles change often: confirm with `--llm-list-models` before a real run. ---
    gemini:                        # BEST FREE FIT: 10 rpm / 250k tokens-per-minute / 1500 req-day, 1M context
      provider: gemini             # -> https://generativelanguage.googleapis.com/v1beta/openai/ (OpenAI-compatible)
      api_key_env: GEMINI_API_KEY  # key from https://aistudio.google.com/apikey
      researcher_model: gemini-3.7-flash
      engineer_model: gemini-3.7-flash
      debugger_model: gemini-3.7-flash
      scribe_model: gemini-3.7-flash
      max_output_tokens: {researcher: 3000, engineer: 12000, debugger: 12000, scribe: 300}
      max_retries: 5

    groq:                          # free, very fast, but only ~6k tokens-per-minute -> long waits on big briefings
      provider: groq               # -> https://api.groq.com/openai/v1   key: https://console.groq.com/keys
      api_key_env: GROQ_API_KEY
      researcher_model: openai/gpt-oss-120b
      engineer_model: openai/gpt-oss-120b
      debugger_model: openai/gpt-oss-120b
      scribe_model: llama-3.1-8b-instant
      max_output_tokens: {researcher: 3000, engineer: 12000, debugger: 12000, scribe: 300}
      max_retries: 6

    openrouter:                    # the default provider — this profile only exists to switch BACK to it
      provider: openrouter         # free: 20 rpm / 50 req-day (1000/day once the account has spent $10 once)
      api_key_env: OPENROUTER_API_KEY

    openrouter_free:               # $0 but flaky: free variants are contended (429) and some have no endpoint
      provider: openrouter
      api_key_env: OPENROUTER_API_KEY
      researcher_model: minimax/minimax-m3:free
      engineer_model: minimax/minimax-m3:free
      debugger_model: minimax/minimax-m3:free
      scribe_model: cohere/north-mini-code:free
      fallback_models: {researcher: [z-ai/glm-5.2:free, minimax/minimax-m3], engineer: [z-ai/glm-5.2:free, minimax/minimax-m3],
                        debugger: [z-ai/glm-5.2:free, minimax/minimax-m3], scribe: [minimax/minimax-m3:free, deepseek/deepseek-v4-flash]}

    fast:                          # measured 2026-08-29 on a real Engineer job (rewrite the 230-line champion pipeline):
      provider: openrouter         # qwen3-coder 21 s / 160 tok/s / $0.0045 per call, codestral 16 s / 197 tok/s / $0.0028,
      api_key_env: OPENROUTER_API_KEY   # deepseek-v4-flash 146 s (9.6k tokens incl. reasoning) / $0.002. ~$0.01 per iteration.
      researcher_model: deepseek/deepseek-v4-flash    # once per iteration; its reasoning helps planning
      engineer_model: qwen/qwen3-coder                # non-reasoning coder: the whole output budget is the file
      debugger_model: qwen/qwen3-coder
      scribe_model: mistralai/codestral-2508
      reasoning: {researcher: {effort: medium}, engineer: {}, debugger: {}, scribe: {}}
      fallback_models: {researcher: [qwen/qwen3-coder, z-ai/glm-5.3-flash], engineer: [mistralai/codestral-2508, qwen/qwen3-coder-next],
                        debugger: [mistralai/codestral-2508, qwen/qwen3-coder-next], scribe: [qwen/qwen3-coder]}

    openrouter_open:               # open-weight models only (~$0.03 per iteration): the pre-Claude default
      provider: openrouter
      api_key_env: OPENROUTER_API_KEY
      researcher_model: z-ai/glm-5.2
      engineer_model: qwen/qwen3-coder
      debugger_model: qwen/qwen3-coder
      scribe_model: deepseek/deepseek-v4-flash
      reasoning: {researcher: {max_tokens: 6000}, engineer: {max_tokens: 4000}, debugger: {max_tokens: 4000}, scribe: {effort: none}}
      fallback_models: {researcher: [minimax/minimax-m3], engineer: [minimax/minimax-m3, deepseek/deepseek-v4-flash],
                        debugger: [minimax/minimax-m3, deepseek/deepseek-v4-flash], scribe: [qwen/qwen3-coder]}

    openrouter_glm:                # higher-quality open weights (#1 on the Artificial Analysis index), ~4x the cost
      provider: openrouter
      api_key_env: OPENROUTER_API_KEY
      researcher_model: z-ai/glm-5.2
      engineer_model: z-ai/glm-5.2
      debugger_model: z-ai/glm-5.2
      scribe_model: deepseek/deepseek-v4-flash
      fallback_models: {researcher: [minimax/minimax-m3], engineer: [minimax/minimax-m3],
                        debugger: [minimax/minimax-m3], scribe: [minimax/minimax-m3]}

    openrouter_claude:             # same key, real Claude models (pay-as-you-go, ~$10-20 for a full run)
      provider: openrouter
      api_key_env: OPENROUTER_API_KEY
      researcher_model: anthropic/claude-opus-4.8
      engineer_model: anthropic/claude-opus-4.8
      debugger_model: anthropic/claude-opus-4.8
      scribe_model: anthropic/claude-haiku-4.5
      fallback_models: {}

    anthropic:                     # native Anthropic API (prompt caching + adaptive thinking + effort)
      provider: anthropic
      api_key_env: ANTHROPIC_API_KEY
      researcher_model: claude-opus-5
      engineer_model: claude-opus-5
      debugger_model: claude-opus-5
      scribe_model: claude-haiku-4-5
      fallback_models: {}

    cerebras:                      # 1M tokens/day free BUT 8k context on the free tier -> too small for the
      provider: cerebras           # Researcher/Engineer briefings; usable for the Scribe only.
      api_key_env: CEREBRAS_API_KEY
      researcher_model: gpt-oss-120b
      engineer_model: gpt-oss-120b
      debugger_model: gpt-oss-120b
      scribe_model: gpt-oss-120b
      max_output_tokens: {researcher: 2000, engineer: 8000, debugger: 8000, scribe: 300}

    deepseek:                      # cheap PAID (no free tier), strong at code -> https://api.deepseek.com
      provider: deepseek
      api_key_env: DEEPSEEK_API_KEY
      researcher_model: deepseek-chat
      engineer_model: deepseek-chat
      debugger_model: deepseek-chat
      scribe_model: deepseek-chat
      max_output_tokens: {researcher: 3000, engineer: 8000, debugger: 8000, scribe: 300}

    poe:                           # Poe's Anthropic-compatible gateway: one Poe key gives access to the Claude bots.
      provider: poe                # -> base_url https://api.poe.com, key sent as x-api-key, core Messages API only
      api_key_env: POE_API_KEY
      base_url: https://api.poe.com
      # Poe bot handles as listed by GET https://api.poe.com/v1/models on 2026-08-28: claude-opus-4.8 / 4.7 / 4.6 / 4.5,
      # claude-sonnet-4.6 / 4.5, claude-haiku-4.5 (no Opus 5 / Sonnet 5 exposed by the API yet). Verify with --llm-check.
      researcher_model: claude-opus-4.8
      engineer_model: claude-opus-4.8
      debugger_model: claude-opus-4.8
      scribe_model: claude-haiku-4.5
      refusal_fallbacks: false     # beta headers / fallbacks / thinking / effort / cache_control are not sent to gateways
      prompt_caching: false
      thinking: {researcher: none, engineer: none, debugger: none, scribe: none}
      effort: {researcher: null, engineer: null, debugger: null, scribe: null}
      max_output_tokens: {researcher: 3000, engineer: 12000, debugger: 12000, scribe: 300}

run:
  EPSILON: 0.002                   # streak resets only on improvement > EPSILON over best-so-far
  N_FLAT: 3                        # converged after N_FLAT consecutive flat/failed iterations
  MAX_ITERS: 50
  WALL_CLOCK_HOURS: 6
  PROMOTE_MARGIN: 0.0002           # promotion needs primary > best + PROMOTE_MARGIN (separate from EPSILON). Team decision
                                   # 2026-08-29: 0.0002 ≈ the seed noise of a 3-seed-averaged pipeline. 0.0005 discarded two
                                   # real +0.0004 gains in one run, so nothing compounded. Spec default was 0.0010.
  DEBUG_RETRIES: 3                 # debugger attempts per iteration; retries never consume iterations
  EXPERIMENT_TIMEOUT_S: 1500       # hard kill for one pipeline run (train + predict val + in-run ablation fits)
  FINALIZE_TIMEOUT_S: 1800         # hard kill for the single champion --split test pass
  STALL_FAILURES: 3                # N consecutive failed iterations -> canned recovery directive in next briefing
  implausible_gauc_below: 0.5      # a scored GAUC below this = inverted ranking (random is 0.5): one Debugger pass for a
                                   # sign/logic fix before the result is accepted (set null to disable)
  implausible_primary_above: 0.70  # free first-line leak check: a would-be promotion scoring above this is flagged as a
                                   # LEAK without a re-run (oracle 0.8484, baseline 0.6015, best known lever +0.003)
  leak_check: on_improvement       # every iteration that beats the champion (promoted or not) is re-run on a copy where 10%
                                   # of validation users have their feedback columns flipped; clean improvements below the
                                   # margin are still recorded as best_measured and used at finalize (never lost)
  leak_check_min_delta: 0.005      # re-run the flipped-label test only when the improvement over the champion is at
                                   # least this. Team decision 2026-08-29: leaks are PREVENTED up front (Engineer
                                   # self-audit + LEAK AUDIT lines + static feedback-column check) and the re-run is
                                   # reserved for large jumps — 0.005 exceeds every honest single lever measured on this
                                   # data. Improvements below it are promoted on the front-line guards alone (recorded
                                   # as verdict "skipped"). 0.0 = verify every improvement (the re-run costs ~one fit
                                   # on the pipeline's fast path, KUAIRAND_FAST=1).
  leak_check_min_primary: 0.5      # feedback columns flipped; those users' TRUE labels scored below this (random) = the
                                   # code reads validation labels -> LEAK, never promoted. A crash on the 10% copy retries
                                   # at 2%; crashes on both = inconclusive, not promoted. (leak_check: off disables)
  sizing_directive: true           # every briefing (except the last shot) carries the SIZING DIRECTIVE: under the
                                   # per-iteration rule a proposal must be sized to clear EPSILON on its own — one
                                   # hypothesis + validated riders, a numeric expected_gain with evidence, and an
                                   # ablation_plan so attribution happens INSIDE the run (ABLATION lines in stdout)
                                   # instead of costing iterations. Streak 0 = boldest structural bet (new information
                                   # beats capacity); streak 1 = best-evidence structural variant + riders.
  # Convergence is the organizers' rule verbatim (kit README, baseline_scores.json): three consecutive iterations whose
  # validation primary improves by <= EPSILON over the best-so-far -> converged; failed iterations count. No other
  # reading is implemented (a cumulative "window" variant was tried on 2026-08-29 and reverted; see NOTES.md).
  # Briefing depth: the context window is ~1M tokens and a briefing costs ~6k, so detail is nearly free. The Researcher
  # gets the full hypothesis, change spec, rationale, code diff and training curve of the last N iterations, so it can
  # tell WHICH component of a bundled change worked and decide whether to continue it.
  briefing_recent_iterations: 5
  briefing_diff_chars: 2500
  briefing_spec_chars: 1200
  retry_timeouts_with_debugger: true    # a timeout usually IS a bug (a Python loop over users x rows): one Debugger pass
                                        # with the training-log tail before the iteration counts as lost
  mask_test_period_in_loop: true   # experiments see a derived data dir WITHOUT test-period rows
  categories: [feature, model, training, multitask, other]   # §5.1 category vocabulary

paths:
  starter_kit: ./starter_kit
  data: ./starter_kit/KuaiRand-Pure/data          # kit README: unpack KuaiRand-Pure inside the kit dir
  loop_data: ./data_cache/loop_train_valid        # derived train+valid-only copy used during the loop
  sealed: ./sealed
  runs: ./runs
  prompts: ./prompts
  knowledge: ./knowledge/library.md
  baseline_repro: ./baseline_repro                # iteration-0 champion source (pipeline.py)
  baseline_scores: ./starter_kit/baseline_scores.json   # published rungs; Phase 0 reads expectations from here

phase0:
  assert_rungs: true               # abort loudly if the rungs / baseline do not reproduce
  rung_tolerance: 0.01             # |random - published| and |pop - published| on VALID
  baseline_tolerance: 0.005        # |FM - published 0.6016| on VALID (5-seed std is 0.0008)
  random_seed: 0
  pop_prior: 20.0                  # same smoothing prior as starter_kit/baseline.py run_pop

sandbox:
  python: null                     # null -> the interpreter running the harness (project venv)
  isolation: auto                  # auto | sandbox-exec | none  (auto = sandbox-exec on macOS, else none+warning)
  env_passthrough: [PATH, HOME, LANG, LC_ALL, TMPDIR]   # everything else (incl. API keys) is stripped
  threads: null                    # e.g. 4 -> OMP/MKL/OPENBLAS thread caps for the pipeline process
  # Static guard on LLM-written code before it runs (defence in depth; the OS sandbox is the real wall).
  forbidden_imports: [subprocess, socket, urllib, requests, http, ftplib, smtplib, telnetlib, pip, ensurepip, ctypes]
  forbidden_patterns: ["pip install", "os.system(", "os.popen(", "os.execv", "shutil.rmtree(", "__import__("]
  feedback_columns: [is_click, is_like, is_follow, is_comment, is_forward, is_hate, long_view, is_profile_enter, play_time_ms]
                                   # named inside a *FIELD*/*FEAT* list assignment = label leak by construction -> code is
                                   # not executed, the Debugger gets the reason (retries are free; a promoted leak is not)

# Toy task (Phase-1 skeleton demo and tests): mini synthetic dataset in kit format + dummy pipeline.
toy:
  data_dir: ./data_cache/toy/data
  loop_data: ./data_cache/toy/loop
  champion_src: ./data_cache/toy/champion
  seed: 0
  overrides:
    run: {MAX_ITERS: 5, N_FLAT: 99, EXPERIMENT_TIMEOUT_S: 60, FINALIZE_TIMEOUT_S: 60}
    llm: {scribe_narrative: true}
